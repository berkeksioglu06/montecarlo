name: Validate and collect market data

on:
  workflow_dispatch:
  push:
    paths:
      - market_data.py
      - requirements.txt
      - tests/**
      - .github/workflows/market-data.yml

concurrency:
  group: market-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Download and validate all eight symbols
        run: python market_data.py
      - name: Preserve download diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-data-snapshot
          path: data/
          if-no-files-found: ignore
          retention-days: 30
      - name: Commit the validated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/
          git commit -m "Save validated market data snapshot"
          git push
